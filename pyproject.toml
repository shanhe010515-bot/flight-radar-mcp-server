[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "flight-radar-mcp-server"
version = "1.0.0"

description = "Real-time aircraft radar MCP server powered by OpenSky Network and FastMCP"

readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "fastmcp",
    "requests>=2.31.0",
    "python-dotenv"
]


[tool.setuptools]
py-modules = ["server"]